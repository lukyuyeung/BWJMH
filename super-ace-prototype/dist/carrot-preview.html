<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bunny Gala · 蘿蔔慶典預覽</title><style>
*{box-sizing:border-box}body{margin:0;background:#140b19;color:#f9e5b8;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:22px}h1{font-size:23px;margin:0 0 8px}p{font-size:13px;color:#d7bdcb;line-height:1.6}.layout{display:flex;gap:26px;align-items:flex-start;justify-content:center}.choices{max-width:350px;display:grid;gap:10px}button,a{font:inherit;color:#ffe6b0}button{border:1px solid #a37b47;border-radius:7px;background:#301329;padding:14px;text-align:left;cursor:pointer}button.active{background:#602341;border-color:#ffbc71}small{display:block;color:#d7bdcb;margin-top:5px;line-height:1.5}.stage{width:390px;height:844px;max-width:100%;flex:none;overflow:hidden}iframe{width:390px;height:844px;border:0;transform-origin:top left}a{font-size:13px}@media(max-width:760px){main{padding:15px}.layout{flex-direction:column;align-items:center}.choices{width:100%;max-width:390px;grid-template-columns:1fr 1fr}.choices a,.choices p{grid-column:1/-1}button{padding:10px;font-size:13px}}
</style></head><body><main><h1>Bunny Gala · 蘿蔔慶典設計預覽</h1><p>逐項播放最新設計，使用獨立示範，不會讀取或改變你的遊戲蘿蔔。</p><div class="layout"><section class="choices"><button data-demo="feed">直向送牌<small>牌從出口前唇下方送出，再落到對應列。</small></button><button data-demo="scenes">倍率氣氛轉場<small>四階交疊淡入淡出，×5／×10 進入蘿蔔場景。</small></button><button data-demo="free">FREE CARROT SPIN<small>金帽兔子咬金蘿蔔；5秒後切換免費氣氛，等待手動開始。</small></button><button data-demo="big">BIG WIN 蘿蔔瀑布<small>獎勵完成後倒數5秒，可提早收下。</small></button><button data-demo="mega">MEGA WIN 蘿蔔瀑布<small>三層持續落下，底部蘿蔔堆逐漸湧起。</small></button><p id="status">選擇一項開始。</p><a href="index.html">返回正式試玩畫面</a></section><div class="stage"><iframe id="game" src="index.html?review=1" title="獨立設計示範"></iframe></div></div></main><script>
const frame=document.querySelector('#game'),stage=document.querySelector('.stage');function resize(){const scale=Math.min(1,(innerWidth-30)/390);frame.style.transform=`scale(${scale})`;stage.style.width=390*scale+'px';stage.style.height=844*scale+'px'}resize();addEventListener('resize',resize);let run=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));document.querySelectorAll('[data-demo]').forEach(button=>button.onclick=async()=>{const id=++run;document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));document.querySelector('#status').textContent='正在準備…';frame.src='index.html?review=1&demo='+id;await new Promise(r=>frame.onload=r);while(!frame.contentWindow.galaDebug){await sleep(30);if(run!==id)return}const api=frame.contentWindow.galaDebug;while(!api.getState().visualReady){await sleep(50);if(run!==id)return}if(run!==id)return;document.querySelector('#status').textContent='播放中；可直接操作示範內的按鍵。';if(button.dataset.demo==='feed')api.demoAnimation();if(button.dataset.demo==='free')api.previewFeature(10);if(button.dataset.demo==='big')api.previewReward(280);if(button.dataset.demo==='mega')api.previewReward(111111000);if(button.dataset.demo==='scenes'){for(const step of[{heat:0},{heat:1},{heat:2},{heat:3},{heat:3,isFree:true}]){if(run!==id)return;api.setReviewState(step);await sleep(2200)}}});
</script></body></html>
