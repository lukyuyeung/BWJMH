<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bunny Gala · 動畫預覽</title><style>
*{box-sizing:border-box}body{margin:0;background:#160c1a;color:#f9e8c5;font-family:system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:20px}h1{font-size:24px;margin:0 0 8px}p{font-size:14px;line-height:1.6;color:#cbb8c9}a{color:#f4cb83}button,select{font:inherit;color:inherit;background:#35172f;border:1px solid #a17a47;border-radius:7px;min-height:44px;padding:8px 12px;cursor:pointer}button.active{background:#783051;border-color:#f3c774}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.layout{display:grid;grid-template-columns:390px 1fr;gap:24px}.stage-window{width:100%;max-width:390px;aspect-ratio:390/844;position:relative;overflow:hidden;border:1px solid #80613c;border-radius:12px;background:#180d1b}iframe{position:absolute;width:390px;height:844px;border:0;transform-origin:top left;pointer-events:none}.group{margin:0 0 18px}.group h2{font-size:16px}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{padding:8px;border-bottom:1px solid #6e45604a}.item button{display:block;text-align:left;width:100%;font-size:12px}.item a{display:inline-block;font-size:11px;margin:7px}#current{font-size:15px;font-weight:600;margin:10px 0;min-height:24px}#status{font-size:12px;color:#d8bd8d;min-height:20px}.live{position:sticky;top:12px;align-self:start}.note{font-size:12px}@media(max-width:760px){main{padding:14px}.layout{grid-template-columns:1fr}.live{position:static}.stage-window{margin:auto;max-height:none}.items{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main><h1>Bunny Gala · 48 項動畫預覽</h1><p>選擇項目即在遊戲畫面播放。這是獨立示範，不會讀取或改變你的遊戲蘿蔔。</p><div class="toolbar"><label>速度 <select id="mode"><option value="0">正常</option><option value="1">2×</option><option value="2">MAX（略過過場）</option><option value="reduced">減少動態</option></select></label><button id="replay">重播</button><button id="next">下一項</button><button id="list">返回清單</button><a href="index.html">返回遊戲</a></div><div class="layout"><section class="live"><div id="current">正在準備預覽…</div><div class="stage-window"><iframe id="game" src="index.html?review=1" title="動畫示範畫面"></iframe></div><p id="status" role="status"></p><p class="note">影片是正常速度的實際畫面錄製；MAX 保留結果，略過過場。</p></section><section id="catalog" aria-label="動畫清單"></section></div></main><script type="module">
import{ANIMATION_DEFINITIONS}from'./effects.js?v=motion-48';
const frame=document.querySelector('#game'),windowBox=document.querySelector('.stage-window'),catalog=document.querySelector('#catalog');let current='ANIM-01',handle,api;
new ResizeObserver(()=>frame.style.transform=`scale(${windowBox.clientWidth/390})`).observe(windowBox);
for(const group of [...new Set(ANIMATION_DEFINITIONS.map(x=>x.group))]){const section=document.createElement('section');section.className='group';const h=document.createElement('h2');h.textContent=group;section.append(h);const list=document.createElement('div');list.className='items';for(const item of ANIMATION_DEFINITIONS.filter(x=>x.group===group)){const row=document.createElement('div');row.className='item';const button=document.createElement('button');button.dataset.id=item.id;button.textContent=`${item.id} · ${item.name}`;button.onclick=()=>play(item.id,true);row.append(button);const link=document.createElement('a');link.href=`animation-previews/${item.id.slice(-2)}.mp4`;link.textContent='觀看錄製影片';link.target='_blank';row.append(link);list.append(row)}section.append(list);catalog.append(section)}
async function play(id,focus=false){if(focus&&innerWidth<=760)document.querySelector('.live').scrollIntoView({block:'start'});if(!api)return;handle?.cancel();api.effects.clear();const mode=document.querySelector('#mode').value;api.effects.setReducedMotion(mode==='reduced');api.setReviewSpeed(mode==='reduced'?0:Number(mode));current=id;document.querySelectorAll('[data-id]').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const item=ANIMATION_DEFINITIONS.find(x=>x.id===id);document.querySelector('#current').textContent=`${item.id} · ${item.name}`;document.querySelector('#status').textContent='播放中';handle=api.previewAnimation(id);await handle.finished;if(current===id)document.querySelector('#status').textContent='播放完畢，可重播或選擇另一項'}
frame.addEventListener('load',async()=>{api=frame.contentWindow.galaDebug;if(!api){document.querySelector('#status').textContent='未能載入，請重新整理。';return}await api.effects.ready;api.effects.stopIdle();play(current)});document.querySelector('#mode').onchange=()=>play(current);document.querySelector('#replay').onclick=()=>play(current,true);document.querySelector('#next').onclick=()=>play(ANIMATION_DEFINITIONS[(ANIMATION_DEFINITIONS.findIndex(x=>x.id===current)+1)%48].id,true);document.querySelector('#list').onclick=()=>catalog.scrollIntoView({block:'start'});if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelector('#mode').value='reduced';
</script></body></html>
