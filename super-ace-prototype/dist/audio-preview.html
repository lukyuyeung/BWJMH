<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bunny Gala · 音效對照試聽</title><style>body{margin:0;background:#180d1b;color:#ffe5b8;font:15px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}h1{font-size:25px}p{line-height:1.7;color:#ceb9c7}a{color:#ffe5b8}#tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}button{font:inherit;background:#36142d;color:#ffe5b8;border:1px solid #a77a42;border-radius:7px;padding:13px;cursor:pointer;text-align:left}button.active{background:#6b2848;border-color:#ffd47f}small{display:block;color:#c6adbc;font-size:11px;margin-top:5px}#status{position:sticky;top:0;padding:15px;background:#180d1bf5;min-height:25px}#stop{margin-bottom:18px}</style></head><body><main><h1>Bunny Gala · 音效對照試聽</h1><p>這裡保留37個原始音頻供試聽；遊戲已改為待機、roll、單段中獎音樂流程。此頁獨立試聽，沒有下注或獎勵操作；大廳、離開及購買音效可在此預覽。遊戲目前沒有購買免費旋轉功能；4個角色VO檔案尚未提供。</p><a href="index.html">返回遊戲</a><p id="status" role="status">按一個音效開始試聽。</p><button id="stop">停止試聽</button><section id="tracks"></section></main><script type="module">
import {AUDIO_CATALOG} from './audio-catalog.js?v=roll-flow-v1';import {createGameMusic} from './music.js?v=roll-flow-v1';
let run=0;const audio=createGameMusic();window.galaAudioPreview=audio;const status=document.getElementById('status'),names={auto_spin:'開啟AUTO',bet_change:'調整下注',bgm_bonus:'免費遊戲BGM',bgm_main:'主遊戲BGM',big_joker:'惡魔WILD擴散',buy_bonus:'購買免費遊戲',card_shuffle:'洗牌發牌',cascade:'連鎖消除',coins:'蘿蔔獎勵灑落',freespin_bigwin:'免費遊戲大獎',freespin_result:'免費遊戲結算',freespin_retrigger:'追加免費遊戲',freespin_trigger:'三CARROT免費觸發',golden_card:'金牌出現',golden_eliminate:'金牌變身',intro:'開場',jackpot:'Jackpot（>1000×）',little_joker:'天使WILD落地',lobby:'待開始BGM',mega_win:'20×至100×',multiplier:'倍率提升',no_coins:'蘿蔔不足',no_win:'沒有中獎',pause:'暫停',paytable_open:'玩法說明',quit:'離開',reel_spin:'派牌進行',reel_stop:'單列停牌',return_base:'返回普通模式',scatter:'CARROT出現',scatter_near:'兩CARROT期待',settings_open:'開啟設定',turbo_spin:'開啟加速',ultimate_win:'100×至1000×',win_big:'5×至20×',win_countup:'獎勵數字',win_normal:'普通中獎'};
for(const t of AUDIO_CATALOG.tracks){const b=document.createElement('button');b.textContent=names[t.id]||t.id;const s=document.createElement('small');s.textContent=t.sourceFile+' · '+t.duration+'秒';b.append(s);b.onclick=async()=>{const id=++run;document.querySelectorAll('#tracks button').forEach(x=>x.classList.toggle('active',x===b));status.textContent='正在準備：'+(names[t.id]||t.id);try{await audio.preview(t.id);if(id!==run)return;status.textContent='試聽：'+(names[t.id]||t.id)}catch{status.textContent='音效未能載入，請重試。'}};document.getElementById('tracks').append(b)}document.getElementById('stop').onclick=()=>{run++;audio.stop();status.textContent='已停止試聽。'};document.addEventListener('visibilitychange',()=>document.hidden?audio.pause():audio.resume());
</script></body></html>
