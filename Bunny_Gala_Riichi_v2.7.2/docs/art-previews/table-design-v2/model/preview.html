</style></head><body><header><div><h1>四家牌枱 · 牌山、牌河及立直棒</h1><p>每邊 17 幢 × 2 層　｜　每家牌河 6 × 4＝24 格　｜　37 款牌面（含孔雀一索及三款赤五）</p></div><div class="badge">美術及排位預覽 · 未接入遊戲</div></header><main id="scene" class="scene"></main><section class="detailrow"><div class="detail" id="material"><h2>① 同一牌身：象牙白、黑背、幼金邊</h2><p>全枱共用同一尺寸；牌河平放、手牌直立、牌底接觸枱面。</p></div><div class="detail" id="walls"><h2>② 兩組方向：玩家／對家、左右兩家</h2><p>對家每幢已修正；四邊均為十七幢、上下兩層。</p></div><div class="detail" id="stick"><h2>③ 紅蘿蔔立直棒及預留區</h2><p>四家均在牌河外側與牌山之間留位；不放在手牌旁。</p></div></section><footer>容量示意：牌河填滿以核對二十四格，並展示全套牌面；不是同一副一百三十六張牌的實際牌局快照。粉紅虛線只標示立直棒預留區。</footer><section id="gallery"></section><script type="module" src="./preview.js"></script></body></html>
