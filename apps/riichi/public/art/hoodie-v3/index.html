<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑帽T兔 · 全遊戲素材</title><style>body{margin:0;padding:30px;background:#0b1814;color:#e9dfc3;font:15px system-ui}h1{font:32px serif}a{color:#d8bb7e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}.grid figure{margin:0;padding:12px;background:#1c2924;border:1px solid #786b4b}.grid img{width:100%;height:210px;object-fit:contain}.tiers img{height:auto}figcaption{padding:8px}header img{height:260px}header{display:flex;gap:30px;align-items:center}h2{margin-top:40px}</style><header><img src="character.png" alt="黑帽T兔不戴帽"><div><h1>黑帽T兔 · 全遊戲素材</h1><p>不戴帽 · 灰白兔臉 · 黑色帽 T</p><a href="/?mode=bot">進入遊戲 →</a></div></header><h2>九款表情</h2><div class="grid" id="emotes"></div><h2>宣告 CUT-IN</h2><div class="grid" id="cutins"></div><h2>滿貫至雙倍役滿</h2><div class="grid tiers" id="tiers"></div><script>const groups={emotes:['開心','憤怒','哭泣','驚訝','思考','抱歉','勝利','無語','調皮'].map((s,i)=>[i,s]),cutins:[['chi','吃'],['pon','碰'],['kan','槓'],['riichi','立直'],['ron','榮和'],['tsumo','自摸']],tiers:[['mangan','滿貫'],['haneman','跳滿'],['baiman','倍滿'],['sanbaiman','三倍滿'],['yakuman','役滿'],['double-yakuman','雙倍役滿']]};for(const [group,items] of Object.entries(groups)){document.getElementById(group).innerHTML=items.map(([id,label])=>'<figure><img src="'+group+'/'+id+'.png'+(group==='cutins'&&id==='chi'?'?v=77':'')+'" alt="'+label+'" loading="lazy"><figcaption>'+label+'</figcaption></figure>').join('')}</script></html>
