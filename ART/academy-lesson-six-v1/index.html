<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第六課｜吃、碰、槓與門前清</title><style>body{margin:0;background:#091b16;color:#eeddbb;font:17px/1.8 system-ui}main{max-width:960px;margin:auto;padding:32px}h1,h2,a{color:#efcd8e}section{border:1px solid #8f8057;background:#142a22;padding:24px;margin:20px 0;border-radius:12px}img{width:100%;border-radius:8px}</style><main><small>BUNNY ACADEMY · COURSE 06</small><h1>吃、碰、槓與門前清</h1><p>三個固定教學例子，讓你親手鳴牌、出牌及榮和。提示卡按步驟放在左右側，中央牌河保持清楚，並直接框出對手打出的牌。</p><a href="/?mode=bot&lesson=6">進入第六課 →</a><section><h2>01｜吃，只能接上家</h2><p>用一二萬接上家的三萬，組成順子，再親手打出北。吃牌後不能立直；牌形完成仍要有役。</p><img src="chi.png" alt="上家出三萬，提示不擋吃牌按鈕"></section><section><h2>02｜碰白，再親手榮和</h2><p>碰不限哪一家；這次碰白取得役牌，最後展示真正的一番結算。</p><img src="pon.png" alt="提示放左側，右方下家打出的白完整顯示"><img src="ron.png" alt="提示讓開下家打出的四索及榮和按鈕"><img src="report.png" alt="副露後的白牌役與真正結算"></section><section><h2>03｜明槓、自動補牌與新指示牌</h2><p>三張中接第四張中做明槓；自動補九索，指示牌由一張變兩張。暗槓仍保留門前清。</p><img src="kan-complete.png" alt="明槓後補牌及兩張寶牌指示牌"></section><p>首次完成300本機體驗紅蘿蔔，不重複領取；第七課仍待開放。</p></main></html>
